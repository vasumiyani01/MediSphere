<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediSphere | AI-Powered Smart Healthcare Ecosystem</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- React, ReactDOM, and Babel Standalone CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Embedded CSS Styling System (Midnight Black-Blue theme) -->
    <style>
        :root {
            --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
            --font-display: 'Outfit', var(--font-sans);
            --transition-fast: 0.2s ease;
            --transition-normal: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --border-radius-sm: 8px;
            --border-radius-md: 12px;
            --border-radius-lg: 20px;
            --border-radius-full: 9999px;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --shadow-glow: 0 0 25px rgba(59, 130, 246, 0.18);
        }

        :root,
        [data-theme="dark"] {
            --bg-primary: #070b13;
            --bg-secondary: #0c1220;
            --bg-tertiary: #141b2d;
            --bg-glass: rgba(12, 18, 32, 0.75);
            --border-color: rgba(30, 41, 59, 0.7);
            --border-focus: #3b82f6;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #475569;
            --color-primary: #3b82f6;
            --color-primary-hover: #60a5fa;
            --color-primary-glow: rgba(59, 130, 246, 0.25);
            --color-success: #10b981;
            --color-warning: #f59e0b;
            --color-danger: #ef4444;
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            --glass-border: 1px solid rgba(255, 255, 255, 0.05);
            --scrollbar-track: #070b13;
            --scrollbar-thumb: #1e293b;
        }

        [data-theme="light"] {
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --bg-tertiary: #f1f5f9;
            --bg-glass: rgba(255, 255, 255, 0.8);
            --border-color: #cbd5e1;
            --border-focus: #2563eb;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --color-primary: #2563eb;
            --color-primary-hover: #1d4ed8;
            --color-primary-glow: rgba(37, 99, 235, 0.15);
            --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.05);
            --glass-border: 1px solid rgba(255, 255, 255, 0.4);
            --scrollbar-track: #f1f5f9;
            --scrollbar-thumb: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            transition: background-color var(--transition-normal), color var(--transition-normal);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--scrollbar-track);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: var(--border-radius-full);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--color-primary);
        }

        .glass {
            background: var(--bg-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: var(--glass-border);
            box-shadow: var(--glass-shadow);
        }

        .gradient-text {
            background: linear-gradient(135deg, var(--text-primary) 30%, var(--color-primary) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .gradient-blue-text {
            background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        input,
        select {
            background-color: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 12px 16px;
            border-radius: var(--border-radius-md);
            font-family: var(--font-sans);
            font-size: 14px;
            outline: none;
            transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
        }

        input:focus,
        select:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 2px var(--color-primary-glow);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: var(--border-radius-md);
            font-family: var(--font-sans);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            border: none;
            transition: all var(--transition-fast);
            text-decoration: none;
        }

        .btn-primary {
            background-color: var(--color-primary);
            color: #ffffff;
        }

        .btn-primary:hover {
            background-color: var(--color-primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px var(--color-primary-glow);
        }

        .btn-secondary {
            background-color: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background-color: var(--bg-secondary);
            border-color: var(--color-primary);
        }

        .btn-ghost {
            background-color: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            border: none;
            transition: all var(--transition-fast);
        }

        .btn-ghost:hover {
            background-color: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-lg);
            padding: 24px;
            transition: transform var(--transition-normal), border-color var(--transition-normal), box-shadow var(--transition-normal);
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: var(--hover-color, var(--color-primary));
            box-shadow: var(--hover-glow, var(--shadow-glow));
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            border-radius: var(--border-radius-full);
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .badge-primary {
            background-color: var(--color-primary-glow);
            color: var(--color-primary);
        }

        .badge-success {
            background-color: rgba(16, 185, 129, 0.15);
            color: var(--color-success);
        }

        .badge-warning {
            background-color: rgba(245, 158, 11, 0.15);
            color: var(--color-warning);
        }

        .badge-danger {
            background-color: rgba(239, 68, 68, 0.15);
            color: var(--color-danger);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in {
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes pulse-glow {

            0%,
            100% {
                box-shadow: 0 0 15px rgba(59, 130, 246, 0.15);
            }

            50% {
                box-shadow: 0 0 25px rgba(59, 130, 246, 0.3);
            }
        }

        .pulse-glow {
            animation: pulse-glow 3s infinite ease-in-out;
        }

        .hero-banner {
            background: linear-gradient(135deg, rgba(12, 18, 32, 0.8) 0%, rgba(7, 11, 19, 0.9) 100%);
            border: 1px solid rgba(59, 130, 246, 0.2);
            transition: border-color var(--transition-normal), box-shadow var(--transition-normal);
        }

        .hero-banner:hover {
            border-color: var(--color-primary) !important;
            box-shadow: var(--shadow-glow) !important;
        }

        [data-theme="light"] .hero-banner {
            background: linear-gradient(135deg, rgba(239, 246, 255, 0.9) 0%, rgba(219, 234, 254, 0.9) 100%);
            border: 1px solid rgba(37, 99, 235, 0.25);
        }

        [data-theme="light"] .hero-banner:hover {
            border-color: var(--color-primary) !important;
            box-shadow: 0 0 25px rgba(37, 99, 235, 0.15) !important;
        }

        .social-icon {
            color: var(--text-secondary);
            cursor: pointer;
            transition: color var(--transition-fast), transform var(--transition-fast);
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .social-icon:hover {
            transform: translateY(-2px);
        }

        .social-icon.whatsapp:hover {
            color: #25D366 !important;
        }

        .social-icon.instagram:hover {
            color: #E1306C !important;
        }

        .social-icon.x-logo:hover {
            color: var(--text-primary) !important;
        }

        .social-icon.facebook:hover {
            color: #1877F2 !important;
        }

        .desktop-only button,
        .desktop-nav button {
            transition: transform var(--transition-fast), color var(--transition-fast) !important;
        }

        .desktop-only button:hover,
        .desktop-nav button:hover {
            transform: translateY(-2px) !important;
        }



        .card.stat-card:hover {
            border-color: var(--hover-color) !important;
            box-shadow: var(--hover-glow) !important;
        }

        .theme-slider {
            padding-top: 12px !important;
        }

        /* Theme-colored scrollbars for explore sliders */
        .theme-slider::-webkit-scrollbar {
            height: 8px;
        }

        .theme-slider::-webkit-scrollbar-track {
            background: var(--bg-tertiary);
            border-radius: 4px;
        }

        .theme-slider::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.25);
            border-radius: 4px;
        }

        .theme-slider::-webkit-scrollbar-thumb:hover {
            background: var(--slider-color, var(--color-primary));
        }

        @media (max-width: 768px) {
            .desktop-only {
                display: none !important;
            }
        }
    </style>
</head>

<body>

        // --- COMPONENT: NAVBUTTON ---
        function NavButton({ item, isActive, activeColor, onClick, buttonRef }) {
            const [hover, setHover] = useState(false);

            const textColor = isActive
                ? activeColor
                : hover
                    ? (item.id === 'home' || item.id === 'about' ? 'var(--color-primary)' :
                        item.id === 'medicines' ? '#3b82f6' :
                            item.id === 'diseases' ? '#ef4444' :
                                item.id === 'pharmacies' ? '#f59e0b' :
                                    item.id === 'doctors' ? '#10b981' :
                                        item.id === 'clinics' ? '#a855f7' :
                                            'var(--text-primary)')
                    : 'var(--text-secondary)';

            return (
                <button
                    ref={buttonRef}
                    onClick={onClick}
                    onMouseEnter={() => setHover(true)}
                    onMouseLeave={() => setHover(false)}
                    className="btn-ghost"
                    style={{
                        padding: '8px 16px',
                        borderRadius: '8px',
                        fontSize: '14px',
                        fontWeight: 600,
                        cursor: 'pointer',
                        border: 'none',
                        background: 'transparent',
                        color: textColor,
                        transition: 'color 0.2s ease',
                        position: 'relative'
                    }}
                >
                    {item.label}
                </button>
            );
        }

            const navItems = [

                { id: 'medicines', label: 'Medicines', sectionId: 'section-medicines' },

                    const documentHeight = document.documentElement.scrollHeight;

                    // Bottom of the page fallback -> highlight Contact Us
                    if (scrollPosition + viewportHeight >= documentHeight - 60) {

                        return;

                        return;

                        { id: 'diseases', elId: 'section-diseases' },

                        { id: 'doctors', elId: 'section-doctors' },

                            }
                        }

                    setActiveTab(currentSection);
                };

                window.addEventListener('scroll', handleScroll);
                return () => {
                    window.removeEventListener('scroll', handleScroll);
                };
